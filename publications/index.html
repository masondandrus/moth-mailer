<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Georgia, serif; background-color: #faf9f7; color: #2d2d2d; padding: 40px 20px 80px; }

        .menu-toggle { position: fixed; top: 20px; left: 20px; z-index: 1000; background: white; border: 1px solid #ddd; border-radius: 8px; padding: 10px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .menu-toggle span { display: block; width: 20px; height: 2px; background: #2d2d2d; margin: 4px 0; }
        .menu { position: fixed; top: 0; left: -250px; width: 250px; height: 100%; background: white; box-shadow: 2px 0 10px rgba(0,0,0,0.1); transition: left 0.3s; z-index: 999; padding: 80px 20px 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .menu.open { left: 0; }
        .menu a { display: block; padding: 15px 10px; color: #2d2d2d; text-decoration: none; border-bottom: 1px solid #eee; }
        .menu a:hover { color: #6b705c; }
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 998; display: none; }
        .menu-overlay.open { display: block; }
        .menu-section { padding: 10px 20px 4px; font-weight: bold; font-size: 0.95em; color: #555; }

        header { text-align: center; margin-bottom: 30px; }
        h1 { font-weight: normal; font-size: 2em; margin-bottom: 10px; }
        .subtitle { color: #888; font-size: 1.1em; }
        .updated { color: #aaa; font-size: 0.85em; margin-top: 8px; }

        .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 30px; }
        .filter { background: white; border: 1px solid #ddd; border-radius: 20px; padding: 7px 16px; font-family: Georgia, serif; font-size: 0.95em; color: #555; cursor: pointer; transition: all 0.2s; }
        .filter:hover { border-color: #6b705c; }
        .filter.active { background: #6b705c; border-color: #6b705c; color: white; }

        .list { max-width: 720px; margin: 0 auto; }
        .week { color: #888; font-size: 0.9em; margin: 28px 0 12px; padding-bottom: 6px; border-bottom: 1px solid #e8e6e1; }
        .week:first-child { margin-top: 0; }
        .paper { background: white; border-radius: 12px; padding: 18px 22px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .meta { font-size: 0.8em; color: #999; margin-bottom: 6px; }
        .title { font-size: 1.15em; line-height: 1.4; margin-bottom: 6px; }
        .title a { color: #2d2d2d; text-decoration: none; }
        .title a:hover { color: #6b705c; }
        .authors { font-size: 0.88em; color: #555; line-height: 1.5; margin-bottom: 4px; }
        .journal { font-size: 0.88em; color: #666; font-style: italic; }
        .actions { margin-top: 10px; display: flex; gap: 18px; font-size: 0.88em; }
        .actions a, .actions button { color: #6b705c; background: none; border: none; font-family: Georgia, serif; font-size: 1em; cursor: pointer; text-decoration: none; padding: 0; }
        .actions a:hover, .actions button:hover { text-decoration: underline; }
        .abstract { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid #f0eee9; font-size: 0.92em; line-height: 1.65; color: #444; }
        .abstract.open { display: block; }

        .loading, .empty { text-align: center; padding: 60px 20px; color: #888; line-height: 1.6; }
        .more { display: block; margin: 20px auto 0; background: #6b705c; color: white; border: none; padding: 12px 30px; font-size: 1em; font-family: Georgia, serif; border-radius: 6px; cursor: pointer; }
        .more:hover { background: #5a5f4e; }
    </style>
</head>
<body>
    <div class="menu-toggle" onclick="toggleMenu()">
        <span></span><span></span><span></span>
    </div>
    <div class="menu-overlay" onclick="toggleMenu()"></div>
    <nav class="menu">
        <div class="menu-section">🦋 Moths</div>
        <a href="/">&nbsp;&nbsp;Collection</a>
        <a href="/random">&nbsp;&nbsp;Random</a>
        <a href="/best">&nbsp;&nbsp;Best</a>
        <a href="/quiz">&nbsp;&nbsp;Quiz</a>
        <div class="menu-section">🐌 Sea Slugs</div>
        <a href="/nudibranchs/">&nbsp;&nbsp;Collection</a>
        <a href="/nudibranchs/random/">&nbsp;&nbsp;Random</a>
        <a href="/nudibranchs/best/">&nbsp;&nbsp;Best</a>
        <a href="/nudibranchs/quiz/">&nbsp;&nbsp;Quiz</a>
        <div class="menu-section">🐸 Amphibians</div>
        <a href="/amphibians/">&nbsp;&nbsp;Collection</a>
        <a href="/amphibians/random/">&nbsp;&nbsp;Random</a>
        <a href="/amphibians/best/">&nbsp;&nbsp;Best</a>
        <a href="/amphibians/quiz/">&nbsp;&nbsp;Quiz</a>
        <a href="/publications/">📄 Publications</a>
    </nav>

    <header>
        <h1>📄 Publications</h1>
        <p class="subtitle">New research on moths, sea slugs, and amphibians, every Monday.</p>
        <p class="updated" id="updated"></p>
    </header>

    <div class="filters" id="filters">
        <button class="filter active" data-group="all">All</button>
        <button class="filter" data-group="moth">🦋 Moths</button>
        <button class="filter" data-group="nudibranch">🐌 Sea Slugs</button>
        <button class="filter" data-group="amphibian">🐸 Amphibians</button>
    </div>

    <div class="list" id="list"><div class="loading">Loading papers…</div></div>

    <script>
        const DATA = '/publications/data/';
        const EMOJI = { moth: '🦋', nudibranch: '🐌', amphibian: '🐸' };
        const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        let papers = [];
        let years = [];
        let loadedYears = 0;
        let group = 'all';

        function toggleMenu() {
            document.querySelector('.menu').classList.toggle('open');
            document.querySelector('.menu-overlay').classList.toggle('open');
        }

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function safeUrl(u) {
            return /^https?:\/\//i.test(u || '') ? u : '';
        }

        function fmtPubDate(d) {
            const [y, m] = String(d || '').split('-');
            return m ? `${MONTHS[parseInt(m, 10) - 1] || ''} ${y}` : (y || '');
        }

        function fmtWeek(iso) {
            const d = new Date(iso + 'T12:00:00');
            if (isNaN(d)) return '';
            return `Added ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
        }

        function fmtAuthors(a) {
            if (!a || !a.length) return '';
            return a.length > 3 ? `${a.slice(0, 3).join(', ')}, et al.` : a.join(', ');
        }

        function cardHTML(p, i) {
            const url = safeUrl(p.url);
            const title = url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title);
            const tags = (p.groups || []).map(g => EMOJI[g] || '').join(' ');
            const meta = [tags, fmtPubDate(p.date), p.source === 'bioRxiv' ? 'Preprint' : ''].filter(Boolean).join(' · ');
            const abs = p.abstract ? `<button onclick="toggleAbstract(${i}, this)">Abstract ▾</button>` : '';
            const read = url ? `<a href="${esc(url)}" target="_blank" rel="noopener">Read paper ↗</a>` : '';
            return `
                <div class="paper">
                    <div class="meta">${esc(meta)}</div>
                    <div class="title">${title}</div>
                    <div class="authors">${esc(fmtAuthors(p.authors))}</div>
                    ${p.journal ? `<div class="journal">${esc(p.journal)}</div>` : ''}
                    ${abs || read ? `<div class="actions">${abs}${read}</div>` : ''}
                    ${p.abstract ? `<div class="abstract" id="abs-${i}">${esc(p.abstract)}</div>` : ''}
                </div>`;
        }

        function toggleAbstract(i, btn) {
            const el = document.getElementById('abs-' + i);
            const open = el.classList.toggle('open');
            btn.textContent = open ? 'Abstract ▴' : 'Abstract ▾';
        }

        function render() {
            const list = document.getElementById('list');
            const shown = papers.filter(p => group === 'all' || (p.groups || []).includes(group));
            if (!papers.length) {
                list.innerHTML = '<div class="empty">The first papers arrive on Monday.</div>';
                return;
            }
            if (!shown.length) {
                list.innerHTML = '<div class="empty">No papers for this group yet.</div>';
            } else {
                let html = '', week = null;
                shown.forEach((p, i) => {
                    if (p.added !== week) { week = p.added; html += `<div class="week">${esc(fmtWeek(week))}</div>`; }
                    html += cardHTML(p, i);
                });
                list.innerHTML = html;
            }
            if (loadedYears < years.length) {
                list.insertAdjacentHTML('beforeend',
                    `<button class="more" onclick="loadNextYear()">Show papers from ${years[loadedYears]}</button>`);
            }
        }

        async function loadNextYear() {
            const y = years[loadedYears];
            const r = await fetch(`${DATA}${y}.json`, { cache: 'no-cache' });
            if (!r.ok) throw new Error(`${y}.json: ${r.status}`);
            const doc = await r.json();
            papers = papers.concat(doc.papers || []);
            loadedYears++;
            render();
        }

        document.getElementById('filters').addEventListener('click', e => {
            const b = e.target.closest('.filter');
            if (!b) return;
            document.querySelectorAll('.filter').forEach(x => x.classList.toggle('active', x === b));
            group = b.dataset.group;
            render();
        });

        (async function init() {
            try {
                const r = await fetch(DATA + 'index.json', { cache: 'no-cache' });
                if (r.status === 404) { render(); return; }
                if (!r.ok) throw new Error('index.json: ' + r.status);
                const idx = await r.json();
                years = idx.years || [];
                if (idx.updated) {
                    const d = new Date(idx.updated);
                    document.getElementById('updated').textContent =
                        `${idx.total} papers · last checked ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
                }
                if (years.length) await loadNextYear(); else render();
            } catch (err) {
                console.error('Failed to load publications:', err);
                document.getElementById('list').innerHTML = '<div class="empty">Error loading papers</div>';
            }
        })();
    </script>
</body>
</html>
