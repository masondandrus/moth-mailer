name: Weekly Publications

# Searches PubMed, bioRxiv, and Google Scholar for new moth, nudibranch, and
# amphibian papers and appends them to publications/data/. Never deletes entries.

on:
  schedule:
    - cron: '23 14 * * 1'     # Mondays 14:23 UTC (~6:23am Pacific)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Search and print results without committing'
        type: boolean
        default: false
      days:
        description: 'How many days back to search'
        default: '7'

permissions:
  contents: write

concurrency:
  group: publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Search for new papers
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python publications_tracker.py --days "${{ inputs.days || '7' }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit new papers
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications/data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(publications): weekly papers $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 10
          done
          exit 1
